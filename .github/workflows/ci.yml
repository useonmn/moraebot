name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: No personal paths or emails in tracked files
        # The pattern is split with '' so this file does not match itself.
        run: |
          if git grep -nIiE '/Use''rs/|/hom''e/[a-z]|@gmai''l\.com'; then
            echo "Found a personal path or email in tracked files."
            exit 1
          fi
